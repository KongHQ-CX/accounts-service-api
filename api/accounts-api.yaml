components:
  schemas:
    Account:
      description: "Represents a bank account with its core details including ID,\
        \ type, and current balance."
      x-amf-examples:
        example_0:
          account_id: "123e4567-e89b-12d3-a456-426614174000"
          type: "checking"
          balance: 1500
      type: "object"
      additionalProperties: true
      required:
      - "account_id"
      - "type"
      - "balance"
      properties:
        account_id:
          description: "Unique identifier for the account (UUID v4)"
          example: "123e4567-e89b-12d3-a456-426614174000"
          type: "string"
        type:
          description: "The type of the account (e.g., checking, savings)"
          example: "checking"
          type: "string"
        balance:
          description: "The current balance of the account in the account's currency"
          example: 1500
          type: "number"
    CreateAccountRequest:
      description: "Request payload for creating a new account."
      example:
        type: "savings"
        initial_balance: 5000
      type: "object"
      additionalProperties: true
      required:
      - "type"
      - "initial_balance"
      properties:
        type:
          description: "The type of account to create (e.g., checking, savings)"
          example: "savings"
          type: "string"
        initial_balance:
          description: "The initial balance to fund the account with"
          example: 5000
          type: "number"
    UpdateBalanceRequest:
      description: "Request payload for updating an account's balance via credit or\
        \ debit operations."
      example:
        amount: 100
      type: "object"
      additionalProperties: true
      required:
      - "amount"
      properties:
        amount:
          description: "The amount to credit or debit from the account"
          example: 100
          type: "number"
    ErrorResponse:
      description: "Standard error response structure for all error cases."
      x-amf-examples:
        example_0:
          error_code: "NOT_FOUND"
          message: "The requested account does not exist."
      type: "object"
      additionalProperties: true
      required:
      - "error_code"
      - "message"
      properties:
        error_code:
          description: "A standardized error code identifying the type of error"
          enum:
          - "INTERNAL_ERROR"
          - "NOT_FOUND"
          - "INSUFFICIENT_FUNDS"
          - "INVALID_INPUT"
          example: "NOT_FOUND"
          type: "string"
        message:
          description: "A human-readable description of the error"
          example: "The requested account does not exist."
          type: "string"
