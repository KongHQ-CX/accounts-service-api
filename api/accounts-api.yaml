---
openapi: "3.0.0"
info:
  title: "Accounts API"
  description: "This API manages account information and balances."
  version: "1.0.0"
servers:
- url: "http://localhost:8081"
consumes:
- "application/json"
produces:
- "application/json"
schemes:
- "HTTP"
paths:
  /health:
    x-amf-displayName: "Health Check"
    description: "Health check endpoints for monitoring service status"
    get:
      operationId: "Health check endpoint"
      description: "Returns the API's health status"
      responses:
        200:
          description: "API is healthy"
          content:
            application/json:
              schema:
                x-amf-examples:
                  success: "Accounts API is running"
                type: "string"
    head:
      operationId: "Health check endpoint (HEAD)"
      description: "Returns the API's health status without body"
      responses:
        200:
          description: "API is healthy"
          content: {}
  /accounts:
    x-amf-displayName: "Accounts"
    description: "Operations related to account management (retrieval and balance\
      \ updates)"
    get:
      operationId: "List all accounts"
      description: "Returns a list of all accounts with basic details."
      responses:
        200:
          description: "A list of accounts was successfully retrieved"
          content:
            application/json:
              schema:
                x-amf-examples:
                  multiple_accounts:
                  - account_id: "123e4567-e89b-12d3-a456-426614174000"
                    type: "checking"
                    balance: 1500
                  - account_id: "987fcdeb-51a2-43e7-89bc-765432198765"
                    type: "savings"
                    balance: 5000
                type: "array"
                items:
                  description: "Represents a bank account with its core details including\
                    \ ID, type, and current balance."
                  x-amf-examples:
                    example_0:
                      account_id: "123e4567-e89b-12d3-a456-426614174000"
                      type: "checking"
                      balance: 1500
                    new_account:
                      account_id: "123e4567-e89b-12d3-a456-426614174000"
                      type: "checking"
                      balance: 1000
                    checking_account:
                      account_id: "123e4567-e89b-12d3-a456-426614174000"
                      type: "checking"
                      balance: 1500
                    successful_debit:
                      account_id: "123e4567-e89b-12d3-a456-426614174000"
                      type: "checking"
                      balance: 900
                    successful_credit:
                      account_id: "123e4567-e89b-12d3-a456-426614174000"
                      type: "checking"
                      balance: 2000
                  type: "object"
                  additionalProperties: true
                  required:
                  - "account_id"
                  - "type"
                  - "balance"
                  properties:
                    account_id:
                      description: "Unique identifier for the account (UUID v4)"
                      example: "123e4567-e89b-12d3-a456-426614174000"
                      type: "string"
                    type:
                      description: "The type of the account (e.g., checking, savings)"
                      example: "checking"
                      type: "string"
                    balance:
                      description: "The current balance of the account in the account's\
                        \ currency"
                      example: 1500
                      type: "number"
        500:
          description: "Failed to retrieve accounts due to internal server error"
          content:
            application/json:
              schema:
                description: "Standard error response structure for all error cases."
                x-amf-examples:
                  example_0:
                    error_code: "NOT_FOUND"
                    message: "The requested account does not exist."
                  lock_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Lock error: failed to acquire lock while listing accounts"
                  invalid_balance:
                    error_code: "INVALID_INPUT"
                    message: "Failed to create account: Initial balance must be non-negative"
                  creation_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Failed to create account: Internal server error occurred"
                  not_found:
                    error_code: "NOT_FOUND"
                    message: "Failed to retrieve account: ID 123e4567-e89b-12d3-a456-426614174000\
                      \ not found"
                  server_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Failed to retrieve account: Internal server error occurred"
                  insufficient_funds:
                    error_code: "INSUFFICIENT_FUNDS"
                    message: "Failed to debit account: Insufficient funds - balance\
                      \ is 900.00, attempted to debit 1000.00"
                  example_1:
                    error_code: "NOT_FOUND"
                    message: "Failed to debit account: Account does not exist"
                  example_2:
                    error_code: "INTERNAL_ERROR"
                    message: "Failed to debit account: Internal server error occurred"
                  invalid_amount:
                    error_code: "INVALID_INPUT"
                    message: "Failed to credit account: Amount must be positive"
                  example_3:
                    error_code: "NOT_FOUND"
                    message: "Failed to credit account: Account does not exist"
                  example_4:
                    error_code: "INTERNAL_ERROR"
                    message: "Failed to credit account: Internal server error occurred"
                type: "object"
                additionalProperties: true
                required:
                - "error_code"
                - "message"
                properties:
                  error_code:
                    description: "A standardized error code identifying the type of\
                      \ error"
                    enum:
                    - "INTERNAL_ERROR"
                    - "NOT_FOUND"
                    - "INSUFFICIENT_FUNDS"
                    - "INVALID_INPUT"
                    example: "NOT_FOUND"
                    type: "string"
                  message:
                    description: "A human-readable description of the error"
                    example: "The requested account does not exist."
                    type: "string"
    post:
      operationId: "Create a new account"
      description: "Creates a new account with an initial balance. The account ID\
        \ is automatically generated."
      requestBody:
        content:
          application/json:
            schema:
              description: "Details for the new account including type and initial\
                \ balance. The account ID will be automatically generated."
              x-amf-examples:
                checking_account:
                  type: "checking"
                  initial_balance: 1000
                savings_account:
                  type: "savings"
                  initial_balance: 5000
              type: "object"
              additionalProperties: true
              required:
              - "initial_balance"
              - "type"
              properties:
                initial_balance:
                  description: "The initial balance to fund the account with"
                  example: 5000
                  type: "number"
                type:
                  description: "The type of account to create (e.g., checking, savings)"
                  example: "savings"
                  type: "string"
      responses:
        201:
          description: "Account created successfully"
          content:
            application/json:
              schema:
                description: "Represents a bank account with its core details including\
                  \ ID, type, and current balance."
                x-amf-examples:
                  example_0:
                    account_id: "123e4567-e89b-12d3-a456-426614174000"
                    type: "checking"
                    balance: 1500
                  new_account:
                    account_id: "123e4567-e89b-12d3-a456-426614174000"
                    type: "checking"
                    balance: 1000
                  checking_account:
                    account_id: "123e4567-e89b-12d3-a456-426614174000"
                    type: "checking"
                    balance: 1500
                  successful_debit:
                    account_id: "123e4567-e89b-12d3-a456-426614174000"
                    type: "checking"
                    balance: 900
                  successful_credit:
                    account_id: "123e4567-e89b-12d3-a456-426614174000"
                    type: "checking"
                    balance: 2000
                type: "object"
                additionalProperties: true
                required:
                - "account_id"
                - "type"
                - "balance"
                properties:
                  account_id:
                    description: "Unique identifier for the account (UUID v4)"
                    example: "123e4567-e89b-12d3-a456-426614174000"
                    type: "string"
                  type:
                    description: "The type of the account (e.g., checking, savings)"
                    example: "checking"
                    type: "string"
                  balance:
                    description: "The current balance of the account in the account's\
                      \ currency"
                    example: 1500
                    type: "number"
        400:
          description: "Failed to create account due to invalid input"
          content:
            application/json:
              schema:
                description: "Standard error response structure for all error cases."
                x-amf-examples:
                  example_0:
                    error_code: "NOT_FOUND"
                    message: "The requested account does not exist."
                  lock_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Lock error: failed to acquire lock while listing accounts"
                  invalid_balance:
                    error_code: "INVALID_INPUT"
                    message: "Failed to create account: Initial balance must be non-negative"
                  creation_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Failed to create account: Internal server error occurred"
                  not_found:
                    error_code: "NOT_FOUND"
                    message: "Failed to retrieve account: ID 123e4567-e89b-12d3-a456-426614174000\
                      \ not found"
                  server_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Failed to retrieve account: Internal server error occurred"
                  insufficient_funds:
                    error_code: "INSUFFICIENT_FUNDS"
                    message: "Failed to debit account: Insufficient funds - balance\
                      \ is 900.00, attempted to debit 1000.00"
                  example_1:
                    error_code: "NOT_FOUND"
                    message: "Failed to debit account: Account does not exist"
                  example_2:
                    error_code: "INTERNAL_ERROR"
                    message: "Failed to debit account: Internal server error occurred"
                  invalid_amount:
                    error_code: "INVALID_INPUT"
                    message: "Failed to credit account: Amount must be positive"
                  example_3:
                    error_code: "NOT_FOUND"
                    message: "Failed to credit account: Account does not exist"
                  example_4:
                    error_code: "INTERNAL_ERROR"
                    message: "Failed to credit account: Internal server error occurred"
                type: "object"
                additionalProperties: true
                required:
                - "error_code"
                - "message"
                properties:
                  error_code:
                    description: "A standardized error code identifying the type of\
                      \ error"
                    enum:
                    - "INTERNAL_ERROR"
                    - "NOT_FOUND"
                    - "INSUFFICIENT_FUNDS"
                    - "INVALID_INPUT"
                    example: "NOT_FOUND"
                    type: "string"
                  message:
                    description: "A human-readable description of the error"
                    example: "The requested account does not exist."
                    type: "string"
        500:
          description: "Failed to create account due to internal server error"
          content:
            application/json:
              schema:
                description: "Standard error response structure for all error cases."
                x-amf-examples:
                  example_0:
                    error_code: "NOT_FOUND"
                    message: "The requested account does not exist."
                  lock_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Lock error: failed to acquire lock while listing accounts"
